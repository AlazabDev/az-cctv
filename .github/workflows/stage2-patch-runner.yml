name: Stage 2 patch runner
on:
  push:
    branches:
      - feat/stage-2-product-catalog
    paths:
      - scripts/stage2_editor_patch.py
      - .github/workflows/stage2-patch-runner.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage-2-product-catalog
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/stage2_editor_patch.py
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/PlanCanvas.tsx
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/PlanCanvas.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat(stage2): wire editor to canonical products"
            git push origin HEAD:feat/stage-2-product-catalog
          fi
