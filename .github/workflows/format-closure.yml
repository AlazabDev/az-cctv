name: Develop formatting closure
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/format-closure.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only changed real-customer engineering files
        run: |
          pnpm exec prettier --write \
            src/components/cctv/CctvProjectEditorV2.tsx \
            src/components/cctv/HandoverWorkspace.tsx \
            src/lib/cctv/handover.ts \
            src/components/cctv/boq.ts
      - name: Commit formatting to develop
        run: |
          if ! git diff --quiet -- src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/HandoverWorkspace.tsx src/lib/cctv/handover.ts src/components/cctv/boq.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/HandoverWorkspace.tsx src/lib/cctv/handover.ts src/components/cctv/boq.ts
            git commit -m "style(develop): normalize four engineering modules to project Prettier rules"
            git push origin HEAD:develop
          fi
