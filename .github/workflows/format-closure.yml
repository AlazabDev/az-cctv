name: One-time formatting closure
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/format-closure.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format engineering source
        run: |
          pnpm exec prettier --write src/components/cctv src/lib/cctv src/routes/catalog.tsx src/routes/calculator.tsx
      - name: Commit mechanical formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv src/lib/cctv src/routes/catalog.tsx src/routes/calculator.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(cctv): apply repository prettier formatting"
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
