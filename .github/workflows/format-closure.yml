name: Develop source formatting closure
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/format-closure.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Normalize all TypeScript and React source except generated router
        run: |
          find src tests -type f -name '*.ts' ! -name 'routeTree.gen.ts' -print0 |
            xargs -0 -r pnpm exec prettier --write
          find src tests -type f -name '*.tsx' -print0 |
            xargs -0 -r pnpm exec prettier --write
      - name: Commit source formatting to established develop only
        run: |
          if ! git diff --quiet -- src tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style(develop): normalize legacy source formatting without changing logic"
            git push origin HEAD:develop
          fi
