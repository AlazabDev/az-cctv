name: AZ-CCTV Badr handover validation
on:
  push:
    branches: [badr-delivery-20261107]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/cctv/handover.ts'
      - 'src/components/cctv/HandoverWorkspace.tsx'
      - 'src/components/cctv/CctvProjectEditorV2.tsx'
      - 'tests/cctv-handover.engineering.test.ts'
permissions:
  contents: write
jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # The pre-existing main pnpm-lock is missing @radix-ui/react-toast.
      # Install with manifest reconciliation for this branch until the lockfile is regenerated.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Generate route tree and production build
        run: pnpm build
      - name: TypeScript after generated routes
        run: pnpm exec tsc --noEmit
      - name: Engineering tests
        run: pnpm test
      - name: Normalize previously failing formatting checks
        run: |
          pnpm exec prettier --write \
            src/components/cctv/CctvProjectEditorV2.tsx \
            src/routes/_authenticated/projects.tsx \
            src/routes/cart.tsx src/routes/quote.tsx \
            src/routes/_authenticated/finance.tsx \
            src/routes/store.tsx src/lib/store/catalog.ts
      - name: Commit synchronized lockfile after successful validation
        if: github.ref == 'refs/heads/badr-delivery-20261107'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml src/routeTree.gen.ts src/components/cctv/CctvProjectEditorV2.tsx src/routes/_authenticated/projects.tsx src/routes/cart.tsx src/routes/quote.tsx src/routes/_authenticated/finance.tsx src/routes/store.tsx src/lib/store/catalog.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml src/routeTree.gen.ts src/components/cctv/CctvProjectEditorV2.tsx src/routes/_authenticated/projects.tsx src/routes/cart.tsx src/routes/quote.tsx src/routes/_authenticated/finance.tsx src/routes/store.tsx src/lib/store/catalog.ts
            git commit -m "style(ci): enforce Prettier formatting on validated project and store modules"
            git push origin HEAD:badr-delivery-20261107
          fi
