name: AZ-CCTV Badr handover validation
on:
  push:
    branches: [badr-delivery-20261107]
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/cctv/handover.ts'
      - 'src/components/cctv/HandoverWorkspace.tsx'
      - 'src/components/cctv/CctvProjectEditorV2.tsx'
      - 'tests/cctv-handover.engineering.test.ts'
permissions:
  contents: write
jobs:
  handover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate route tree and production build
        run: pnpm build
      - name: TypeScript after generated routes
        run: pnpm exec tsc --noEmit
      - name: Engineering tests
        run: pnpm test
      - name: Normalize changed engineering modules
        run: |
          pnpm exec prettier --write \
            src/components/cctv/CctvProjectEditorV2.tsx \
            src/components/cctv/HandoverWorkspace.tsx \
            src/lib/cctv/types.ts src/lib/cctv/handover.ts \
            src/lib/cctv/handover-report.ts \
            tests/cctv-handover.engineering.test.ts
      - name: Commit validated formatting only to feature branch
        if: github.ref == 'refs/heads/badr-delivery-20261107'
        run: |
          if ! git diff --quiet -- src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/HandoverWorkspace.tsx src/lib/cctv/types.ts src/lib/cctv/handover.ts src/lib/cctv/handover-report.ts tests/cctv-handover.engineering.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/cctv/CctvProjectEditorV2.tsx src/components/cctv/HandoverWorkspace.tsx src/lib/cctv/types.ts src/lib/cctv/handover.ts src/lib/cctv/handover-report.ts tests/cctv-handover.engineering.test.ts
            git commit -m "style(engineering): format validated calibration and handover modules"
            git push origin HEAD:badr-delivery-20261107
          fi
