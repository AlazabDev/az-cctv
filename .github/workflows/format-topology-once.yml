name: Format topology once

on:
  push:
    branches:
      - fix/repository-hardening-batch-2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/cctv/boq.ts src/components/cctv/TopologyWorkspace.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/boq.ts src/components/cctv/TopologyWorkspace.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize topology workspace and BOQ"
            git push origin HEAD:fix/repository-hardening-batch-2
          fi
