name: Topology engineering validation
on:
  push:
    branches: [feat/topology-engineering-ai]
    paths:
      - .github/workflows/topology-validation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topology-engineering-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire editor to normalized topology and central BOQ
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/cctv/CctvProjectEditorV2.tsx')
          s = p.read_text()
          pairs = [
            ('import { emptyTopology, type TopologyData } from "@/lib/cctv/topology";', 'import { emptyTopology, normalizeTopology, type TopologyData } from "@/lib/cctv/topology";'),
            ('setTopology({ parents: stored.topology?.parents ?? {}, media: stored.topology?.media ?? {} });', 'setTopology(normalizeTopology(stored.topology));'),
            ('const boq = useMemo(() => buildBoq(projectPlan, retention), [projectPlan, retention]);', 'const boq = useMemo(() => buildBoq(projectPlan, retention, { layouts, topology }), [projectPlan, retention, layouts, topology]);'),
          ]
          for old, new in pairs:
            if old in s:
              s = s.replace(old, new, 1)
            elif new not in s:
              raise SystemExit(f'Expected fragment not found: {old}')
          p.write_text(s)
          PY
      - name: Install
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Deterministic topology tests
        run: npx --yes vitest@3.2.4 run tests/topology.engineering.test.ts
      - name: Lint
        run: npm run lint
      - name: Commit editor integration after validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/CctvProjectEditorV2.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Wire topology engineering into central project BOQ"
            git push origin HEAD:feat/topology-engineering-ai
          fi
