name: Topology Engineering CI

"on":
  push:
    branches:
      - feat/topology-engineering-ai
    paths:
      - .github/workflows/topology-ci.yml
      - scripts/apply-topology-engineering-patch.py
      - scripts/apply-topology-final-hardening.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/topology-engineering-ai

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply engineering patch
        run: |
          python3 scripts/apply-topology-engineering-patch.py
          python3 scripts/apply-topology-final-hardening.py

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Format topology engineering files
        run: npx prettier --write src/lib/cctv/topology.ts src/lib/cctv/types.ts src/lib/cctv/catalog.ts src/components/cctv/boq.ts src/components/cctv/TopologyWorkspace.tsx src/lib/topology-ai.functions.ts tests/topology.engineering.test.ts src/components/cctv/CctvProjectEditorV2.tsx

      - name: Build
        run: npm run build

      - name: Deterministic topology tests
        run: npm run test:topology

      - name: Lint topology engineering files
        run: npx eslint src/lib/cctv/topology.ts src/lib/cctv/types.ts src/lib/cctv/catalog.ts src/components/cctv/boq.ts src/components/cctv/TopologyWorkspace.tsx src/lib/topology-ai.functions.ts tests/topology.engineering.test.ts

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/topology.ts src/lib/cctv/types.ts src/lib/cctv/catalog.ts src/lib/topology-ai.functions.ts src/components/cctv/TopologyWorkspace.tsx src/components/cctv/boq.ts tests/topology.engineering.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply validated topology engineering integration"
            git push origin HEAD:feat/topology-engineering-ai
          fi
