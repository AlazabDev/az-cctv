name: Format AZCCTV brand files once
on:
  push:
    branches: ['feature/brand-landing-auth-dashboard-20261014']
    paths: ['.github/workflows/format-brand-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-landing-auth-dashboard-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/lib/brand-assets.ts src/components/BrandLogo.tsx src/components/SiteHeader.tsx src/routes/index.tsx src/routes/auth.tsx src/routes/_authenticated/projects.tsx
      - run: |
          git add src/lib/brand-assets.ts src/components/BrandLogo.tsx src/components/SiteHeader.tsx src/routes/index.tsx src/routes/auth.tsx src/routes/_authenticated/projects.tsx
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(brand): format landing, authentication and dashboard'
          git push origin HEAD:feature/brand-landing-auth-dashboard-20261014
