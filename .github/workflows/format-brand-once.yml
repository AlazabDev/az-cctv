name: Format AZCCTV brand change set
on:
  push:
    branches: ['feature/azcctv-brand-landing-auth-dashboard-20261013']
    paths: ['.github/workflows/format-brand-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/azcctv-brand-landing-auth-dashboard-20261013
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/components/BrandLogo.tsx src/components/SiteHeader.tsx src/routes/index.tsx src/routes/auth.tsx src/routes/_authenticated/projects.tsx src/routes/__root.tsx src/routes/reset-password.tsx src/routes/catalog.tsx src/components/cctv/CctvProjectEditorV2.tsx
      - run: |
          git add src/components/BrandLogo.tsx src/components/SiteHeader.tsx src/routes/index.tsx src/routes/auth.tsx src/routes/_authenticated/projects.tsx src/routes/__root.tsx src/routes/reset-password.tsx src/routes/catalog.tsx src/components/cctv/CctvProjectEditorV2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style(brand): format landing, authentication, and dashboard'
          git push origin HEAD:feature/azcctv-brand-landing-auth-dashboard-20261013
