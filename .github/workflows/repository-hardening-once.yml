name: Repository hardening one-shot

on:
  push:
    branches:
      - fix/repository-hardening-batch-2

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository cleanup
        run: |
          npx prettier --write \
            src/components/cctv/ProductCatalogGate.tsx \
            src/routes/catalog.tsx \
            'src/routes/_authenticated/editor.$id.tsx' \
            src/lib/cctv/catalog.ts \
            src/lib/cctv/product-catalog.ts \
            src/components/cctv/CctvProjectEditorV2.tsx \
            src/components/cctv/MapWorkspace.tsx \
            src/lib/cctv/normalized-layouts.ts \
            src/lib/cctv/topology.ts \
            tests/topology.engineering.test.ts
          if [ -f src/routes/_authenticated/types.ts ]; then
            git mv src/routes/_authenticated/types.ts src/routes/_authenticated/-types.ts
          fi
          rm -f scripts/apply-topology-engineering-patch.mjs
      - name: Validate
        run: |
          npx eslint \
            src/components/cctv/ProductCatalogGate.tsx \
            src/routes/catalog.tsx \
            'src/routes/_authenticated/editor.$id.tsx' \
            src/lib/cctv/catalog.ts \
            src/lib/cctv/product-catalog.ts \
            src/components/cctv/CctvProjectEditorV2.tsx \
            src/components/cctv/MapWorkspace.tsx \
            src/lib/cctv/normalized-layouts.ts \
            src/lib/cctv/topology.ts \
            tests/topology.engineering.test.ts
          npm test
          npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: harden repository validation and formatting"
            git push origin HEAD:fix/repository-hardening-batch-2
          fi
