name: AZCCTV website quality gate
on:
  push:
    branches: [main]
    paths:
      - 'src/components/BrandLogo.tsx'
      - 'src/components/SiteHeader.tsx'
      - 'src/lib/brand-assets.ts'
      - 'src/routes/**'
      - '.github/workflows/brand-auth-dashboard-validation.yml'
  pull_request:
    paths:
      - 'src/components/BrandLogo.tsx'
      - 'src/components/SiteHeader.tsx'
      - 'src/lib/brand-assets.ts'
      - 'src/routes/**'
      - '.github/workflows/brand-auth-dashboard-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm run build
