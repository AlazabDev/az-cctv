name: CCTV editor completion checks
on:
  pull_request:
    paths:
      - "src/components/cctv/CctvProjectEditorV2.tsx"
      - "src/components/cctv/MapWorkspace.tsx"
      - "src/components/cctv/boq.ts"
      - "src/lib/cctv/site-map.ts"
      - "src/lib/cctv/wireless-links.ts"
      - "tests/wireless-ptp.engineering.test.ts"
      - ".github/workflows/cctv-editor-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engineering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: PTP and deployment deterministic tests
        run: pnpm exec vitest run tests/wireless-ptp.engineering.test.ts tests/camera-optics.deployment.test.ts tests/plan-design.wall-editor.test.ts
