name: Format store production changes
on:
  push:
    branches: [feat/store-production-commerce]
    paths:
      - "src/routes/my-quotes.tsx"
      - "src/routes/cart.tsx"
      - "src/routes/quote.tsx"
      - "src/lib/store/checkout.ts"
      - "src/components/SiteHeader.tsx"
      - "src/components/store/KimoSyncPanel.tsx"
      - "src/routes/_authenticated/finance.tsx"
      - "src/routes/store.tsx"
      - "src/lib/store/catalog.ts"
      - "package.json"
      - "src/hooks/use-toast.ts"
      - ".github/workflows/store-autoformat.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/store-production-commerce
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Format only store-modified files
        run: pnpm exec prettier --write src/routes/my-quotes.tsx src/routes/cart.tsx src/routes/quote.tsx src/lib/store/checkout.ts src/components/SiteHeader.tsx src/components/store/KimoSyncPanel.tsx src/routes/_authenticated/finance.tsx src/routes/store.tsx src/lib/store/catalog.ts src/components/cctv/CctvProjectEditorV2.tsx
      - name: Commit formatter result to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src/routes/my-quotes.tsx src/routes/cart.tsx src/routes/quote.tsx src/lib/store/checkout.ts src/components/SiteHeader.tsx src/components/store/KimoSyncPanel.tsx src/routes/_authenticated/finance.tsx src/routes/store.tsx src/lib/store/catalog.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(store): format customer commerce flow"
          git push origin HEAD:feat/store-production-commerce
