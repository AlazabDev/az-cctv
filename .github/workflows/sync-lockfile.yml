name: Synchronize npm lockfile (production branch)
on:
  push:
    branches: ['production/plan-catalog-agent-hardening-20261013']
    paths: ['.github/workflows/sync-lockfile.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/plan-catalog-agent-hardening-20261013
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate committed npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only package-lock.json
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): synchronize npm lockfile with package.json'
          git push origin HEAD:production/plan-catalog-agent-hardening-20261013
