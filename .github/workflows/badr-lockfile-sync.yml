name: Badr branch dependency lock sync
on:
  push:
    branches:
      - hardening/badr-nursery-first-client
    paths:
      - .github/workflows/badr-lockfile-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Regenerate lockfile from manifest without changing dependency declarations
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile changes on this isolated branch only
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "fix(deps): regenerate lockfile for customer delivery branch"
            git push origin HEAD:hardening/badr-nursery-first-client
          fi
