name: UI zero-warning quality gate
on:
  push:
    branches: ['fix/all-react-refresh-warnings-20261013']
  pull_request:
    paths: ['src/components/ui/**','src/components/**','src/routes/**','tests/**','.github/workflows/ui-quality.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint refactored UI modules without warnings
        run: |
          npx eslint --max-warnings 0 \
            src/components/ui/badge.tsx src/components/ui/badge-variants.ts \
            src/components/ui/button.tsx src/components/ui/button-variants.ts \
            src/components/ui/form.tsx src/components/ui/form-context.tsx \
            src/components/ui/navigation-menu.tsx src/components/ui/navigation-menu-variants.ts \
            src/components/ui/sidebar.tsx src/components/ui/sidebar-context.tsx src/components/ui/sidebar-variants.ts \
            src/components/ui/toggle.tsx src/components/ui/toggle-variants.ts
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
