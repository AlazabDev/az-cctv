name: UI zero-warning quality gate
on:
  push:
    branches: ['fix/all-react-refresh-warnings-20261013']
  pull_request:
    paths: ['src/components/ui/**','src/components/**','src/routes/**','tests/**','.github/workflows/ui-quality.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint -- --max-warnings 0
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
