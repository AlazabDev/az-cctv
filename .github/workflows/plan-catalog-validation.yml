name: Plan Design and Product Catalog Validation

on:
  push:
    branches: [main, 'production/**']
    paths:
      - 'src/components/cctv/**'
      - 'src/lib/cctv/**'
      - 'src/integrations/supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/plan-catalog-validation.yml'
  pull_request:
    paths:
      - 'src/components/cctv/**'
      - 'src/lib/cctv/**'
      - 'src/integrations/supabase/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm run build
