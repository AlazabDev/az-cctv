name: Topology patch runner
on:
  push:
    branches:
      - feat/topology-engineering-ai
    paths:
      - scripts/apply-topology-engineering-patch.py
      - .github/workflows/topology-patch-runner.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/topology-engineering-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/apply-topology-engineering-patch.py
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: npm run test:topology
      - run: npx eslint src/lib/cctv/topology.ts src/lib/cctv/types.ts src/lib/cctv/catalog.ts src/components/cctv/boq.ts src/components/cctv/TopologyWorkspace.tsx src/lib/topology-ai.functions.ts tests/topology.engineering.test.ts src/components/cctv/CctvProjectEditorV2.tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/topology.ts src/lib/topology-ai.functions.ts tests/topology.engineering.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply validated topology engineering integration"
            git push origin HEAD:feat/topology-engineering-ai
          fi
