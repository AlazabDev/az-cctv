name: Stage 3 Normalized Multi-Layout CI

on:
  push:
    branches:
      - main
    paths:
      - "src/components/cctv/CctvProjectEditorV2.tsx"
      - "src/lib/cctv/normalized-layouts.ts"
      - "tests/**"
      - ".github/workflows/stage3-normalized-layout-ci.yml"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm exec prettier --check src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/normalized-layouts.ts

      - name: Lint Stage 3 files
        run: pnpm exec eslint src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/normalized-layouts.ts

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
