name: Stage 3 Normalized Multi-Layout CI

"on":
  push:
    branches:
      - feat/stage3-normalized-multi-layout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/stage3-normalized-multi-layout

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Stage 3 editor patch
        run: python3 scripts/stage3_normalized_layout_patch.py

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Format Stage 3 files
        run: npx prettier --write src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/normalized-layouts.ts

      - name: Lint Stage 3 files
        run: npx eslint src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/normalized-layouts.ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit validated Stage 3 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cctv/CctvProjectEditorV2.tsx src/lib/cctv/normalized-layouts.ts
          if ! git diff --cached --quiet; then
            git commit -m "Apply validated normalized multi-layout integration"
            git push origin HEAD:feat/stage3-normalized-multi-layout
          fi
